<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F5F7">
<meta name="color-scheme" content="light">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Treino">
<title>Treino do Henrique</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="manifest" href="manifest.json">
<style>
:root{
  --bg:#F4F5F7;
  --card:#FFFFFF;
  --ink:#16181D;
  --ink-2:#454A53;
  --muted:#7A8089;
  --line:#E3E5E9;
  --soft:#F0F1F3;
  --field:#F8F9FA;
  --coral:#E8342A;
  --coral-press:#C72A21;
  --coral-soft:#FDECEA;
  --green:#16A157;
  --green-soft:#E5F5EC;
  --green-ink:#0C7740;
  --slate:#EEF1F6;
  --slate-line:#C6CFDB;
  --slate-ink:#55627A;
  --water:#2F7FE0;
  --water-soft:#E7F0FC;
  --r:16px;
  --shadow:0 1px 2px rgba(17,24,39,.04),0 6px 18px rgba(17,24,39,.06);
  --nav-h:64px;
  --sb:env(safe-area-inset-bottom,0px);
  --st:env(safe-area-inset-top,0px);
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;padding-bottom:calc(var(--nav-h) + var(--sb) + 28px);overscroll-behavior-y:contain}
body.com-timer{padding-bottom:calc(var(--nav-h) + var(--sb) + 160px)}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;touch-action:manipulation}
input{font:inherit;color:inherit}
:focus-visible{outline:3px solid rgba(232,52,42,.4);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:560px;margin:0 auto;padding:0 12px}

/* Topo */
.topo{display:flex;align-items:center;gap:12px;padding:calc(var(--st) + 18px) 4px 12px}
.topo-txt{flex:1;min-width:0}
.topo-data{margin:0;color:var(--muted);font-size:13px;font-weight:600}
.topo h1{margin:2px 0 0;font-size:23px;line-height:1.2;font-weight:800;letter-spacing:-.02em}
.anel{position:relative;width:60px;height:60px;flex:none}
.anel svg{width:100%;height:100%;transform:rotate(-90deg)}
.anel .trilho{stroke:var(--line)}
.anel .prog{stroke:var(--coral);transition:stroke-dashoffset .5s cubic-bezier(.2,.8,.2,1),stroke .3s}
.anel.zero .prog{opacity:0}
.anel.cheio .prog{stroke:var(--green)}
.anel-txt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05}
.anel-txt b{font-size:14px;font-weight:800;font-variant-numeric:tabular-nums}
.anel-txt small{font-size:10px;font-weight:600;color:var(--muted)}

.pilulas{display:flex;flex-wrap:wrap;gap:8px;padding:0 4px 4px}
.pilula{position:relative;display:inline-flex;align-items:center;gap:7px;min-height:40px;padding:0 14px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);font-size:13px;font-weight:600;color:var(--ink-2)}
.pilula::after{content:'';position:absolute;inset:-4px}
.pilula .ponto{width:8px;height:8px;border-radius:50%;background:#B8BDC5;flex:none}
.pilula.on .ponto{background:var(--green)}
.pilula.alerta{background:var(--coral-soft);color:var(--coral);box-shadow:none}
.pilula.alerta .ponto{background:var(--coral)}

/* Dias */
.dias{position:sticky;top:0;z-index:20;margin:0 -12px;padding:10px 12px 12px;background:linear-gradient(var(--bg) 82%,rgba(244,245,247,0))}
.dias-in{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.dia{position:relative;height:56px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;transition:background .2s}
.dia small{font-size:12px;font-weight:600;color:var(--muted)}
.dia b{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums}
.dia.hoje small{color:var(--coral)}
.dia.ativo{background:var(--coral);box-shadow:0 4px 14px rgba(232,52,42,.28)}
.dia.ativo small,.dia.ativo b{color:#fff}
.dia.feito::after{content:'';position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 2px var(--card)}
.dia.ativo.feito::after{box-shadow:0 0 0 2px var(--coral)}

/* Cards */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin:0 0 12px}
.card-tit{margin:0;font-size:17px;font-weight:800;letter-spacing:-.01em}
.nota{margin:4px 0 12px;color:var(--muted);font-size:13px}
.secao{margin:24px 4px 10px;font-size:14px;font-weight:700;color:var(--muted)}
.vazio{margin:8px 0 0;color:var(--muted);font-size:14px}

.ex-tags{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:8px}
.selo{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;background:var(--soft);font-size:12px;font-weight:700;color:var(--ink-2)}
.selo i{width:7px;height:7px;border-radius:50%;background:var(--c,#8A93A0)}
.selo.destaque{background:var(--coral-soft);color:var(--coral)}
.tipo{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:999px;border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--muted)}
.ex-ok{margin-left:auto;width:26px;height:26px;border-radius:50%;background:var(--green);color:#fff;display:none;place-items:center}
.ex-ok svg{width:15px;height:15px}
.ex.completo .ex-ok{display:grid;animation:pop .4s cubic-bezier(.2,1.6,.4,1)}
.ex h3,.extra h3{margin:0;font-size:18px;line-height:1.25;font-weight:800;letter-spacing:-.01em}
.ex-meta{display:flex;flex-wrap:wrap;gap:2px 12px;margin-top:5px;font-size:13.5px;color:var(--muted)}
.ex-meta b{color:var(--ink);font-weight:800;font-variant-numeric:tabular-nums}
.aprox,.primeira{margin:10px 0 0;font-size:13px;color:var(--ink-2);background:var(--soft);border-radius:10px;padding:8px 10px}
.primeira{background:none;padding:0;color:var(--muted)}

.series{display:grid;gap:8px;margin-top:14px}
.serie{border:1.5px solid var(--line);border-radius:14px;padding:10px 10px 9px;background:var(--card);transition:background .25s,border-color .25s}
.serie-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:0 2px 8px}
.serie-nome{font-size:13px;font-weight:700;color:var(--ink-2)}
.serie-alvo{font-size:12.5px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.serie-campos{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 52px;gap:8px;align-items:center}
.serie-campos.biset .chk{grid-column:3;grid-row:1 / span 4;align-self:center}
.parte{grid-column:1 / span 2;font-size:12px;font-weight:700;color:var(--muted);margin:2px 2px -2px}
.campo{position:relative;display:block;min-width:0}
.campo input{width:100%;height:52px;border:1.5px solid var(--line);border-radius:12px;background:var(--field);padding:0 38px 0 12px;font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em;outline:none;-webkit-appearance:none;appearance:none;transition:border-color .15s,box-shadow .15s,background .15s}
.campo input:focus{border-color:var(--coral);box-shadow:0 0 0 3px var(--coral-soft);background:#fff}
.campo span{position:absolute;right:11px;top:50%;transform:translateY(-50%);font-size:12px;font-weight:700;color:var(--muted);pointer-events:none}
.chk{width:52px;height:52px;border-radius:14px;background:var(--soft);color:#A6ABB3;display:grid;place-items:center;transition:background .2s,color .2s,transform .1s}
.chk:active{transform:scale(.93)}
.chk svg{width:26px;height:26px}
.vac-txt{grid-column:1 / span 2;height:52px;display:flex;align-items:center;padding:0 12px;border-radius:12px;background:var(--field);font-size:15px;font-weight:700;color:var(--ink-2)}
.serie-ult{margin:7px 2px 0;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.serie-ult b{color:var(--ink-2);font-weight:700}

.serie.aq{background:var(--slate);border-style:dashed;border-color:var(--slate-line)}
.serie.aq .serie-nome{color:var(--slate-ink)}
.serie.aq .campo input,.serie.aq .chk{background:#fff}
.serie.top{border-color:#F4BDB8}
.serie.top .serie-nome{color:var(--coral)}
.serie.feito{background:var(--green-soft);border-color:transparent;border-style:solid}
.serie.feito .serie-nome{color:var(--green-ink)}
.serie.feito .campo input,.serie.feito .vac-txt{background:rgba(255,255,255,.7);border-color:transparent}
.serie.feito .chk,.extra.feito .chk,.refeicao.feita .chk{background:var(--green);color:#fff}
.serie.pop .chk,.chk.pop{animation:pop .38s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.72)}60%{transform:scale(1.1)}100%{transform:scale(1)}}

.aviso{display:flex;align-items:flex-start;gap:10px;margin-top:12px;padding:12px;border-radius:12px;font-size:14px;font-weight:700;line-height:1.35}
.aviso svg{width:20px;height:20px;flex:none;margin-top:-1px}
.aviso.subir{background:var(--green-soft);color:var(--green-ink);animation:entra .35s cubic-bezier(.2,1.2,.4,1)}
.aviso.dica{background:var(--soft);color:var(--ink-2);font-weight:600}
.aviso.atencao{background:var(--coral-soft);color:#A3241D}
@keyframes entra{from{opacity:0;transform:translateY(4px) scale(.98)}to{opacity:1;transform:none}}

.extra{display:flex;align-items:center;gap:12px}
.extra-txt{flex:1;min-width:0}
.extra.feito{box-shadow:var(--shadow),inset 0 0 0 1.5px #BFE6CF}
.opcoes{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.opcao{height:44px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);font-size:14px;font-weight:600;color:var(--ink-2)}
.opcao.on{border-color:var(--ink);background:var(--ink);color:#fff}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;padding:0 18px;border-radius:16px;background:var(--coral);color:#fff;font-size:17px;font-weight:800;box-shadow:0 6px 18px rgba(232,52,42,.26);transition:transform .1s,background .15s}
.btn:active{transform:scale(.985);background:var(--coral-press)}
.btn.sec{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.btn.leve{min-height:48px;background:var(--soft);color:var(--ink);box-shadow:none;font-size:15px;font-weight:700}
.btn.texto{min-height:48px;background:none;color:var(--muted);box-shadow:none;font-size:14px;font-weight:600}
.btn[disabled]{opacity:.45;pointer-events:none}
.btns{display:grid;gap:8px}
.btns.duas{grid-template-columns:1fr 1fr}
.btns.tres{grid-template-columns:repeat(3,1fr)}
.final{margin-top:18px}
.final .nota{text-align:center;margin-top:8px}

/* Descanso (domingo) */
.descanso{padding:22px 18px}
.descanso h2{margin:0 0 6px;font-size:20px;font-weight:800}
.descanso p{margin:0 0 6px;color:var(--ink-2)}

/* Dieta */
.linha-meta{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:8px}
.linha-meta b{font-size:15px;font-weight:800}
.linha-meta span{font-size:14px;font-weight:700;color:var(--ink-2);font-variant-numeric:tabular-nums}
.barra{height:10px;border-radius:999px;background:var(--soft);overflow:hidden}
.barra i{display:block;height:100%;width:0;border-radius:inherit;background:var(--coral);transition:width .45s cubic-bezier(.2,.8,.2,1)}
.barra.agua i{background:var(--water)}
.barra.ok i{background:var(--green)}
.agua-bloco{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.agua-num{display:flex;align-items:baseline;gap:6px;margin-bottom:8px}
.agua-num b{font-size:30px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.agua-num span{font-size:14px;font-weight:600;color:var(--muted)}
.agua-num em{margin-left:auto;font-style:normal;font-size:13px;font-weight:700;color:var(--green-ink)}
.agua-btns{margin-top:12px}
.agua-btns .btn{min-height:48px;padding:0 6px;font-size:15px;white-space:nowrap}
.agua-btns .btn.agua{background:var(--water-soft);color:#1D5FB0;box-shadow:none}
.refeicao{display:grid;grid-template-columns:56px minmax(0,1fr) 52px;gap:10px;align-items:start}
.hora{padding-top:1px;font-size:15px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.25}
.refeicao h3{margin:0 0 4px;font-size:16px;font-weight:800}
.itens{margin:0;padding:0;list-style:none;font-size:14px;color:var(--ink-2)}
.itens li{padding:2px 0}
.itens b{color:var(--ink);font-weight:700}
.itens li.fora{color:#A6ABB3;text-decoration:line-through}
.itens small{display:block;font-size:12px;color:var(--muted);text-decoration:none}
.refeicao.feita{box-shadow:var(--shadow),inset 0 0 0 1.5px #BFE6CF}
.bloco-treino{display:grid;grid-template-columns:56px 1fr;gap:10px;align-items:center;padding:12px 16px;margin:0 0 12px;border-radius:var(--r);border:1.5px dashed var(--slate-line);background:var(--slate);color:var(--slate-ink);font-weight:700;font-size:14px}
.bloco-treino .hora{font-size:13px;color:var(--slate-ink)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{display:inline-flex;align-items:center;height:30px;padding:0 12px;border-radius:999px;background:var(--coral-soft);color:#A3241D;font-size:13px;font-weight:700}
.regra-bloco{padding:12px 0;border-top:1px solid var(--line)}
.regra-bloco:first-of-type{border-top:0;padding-top:4px}
.regra-bloco h3{margin:0 0 4px;font-size:15px;font-weight:800}
.regra-bloco p,.regra-bloco li{margin:0;color:var(--ink-2);font-size:14px}
.regra-bloco ul{margin:0;padding-left:18px}

/* Registro */
.form{display:grid;gap:12px}
.form-linha{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rotulo{display:block;margin:0 2px 6px;font-size:13px;font-weight:700;color:var(--ink-2)}
.entrada{width:100%;height:52px;border:1.5px solid var(--line);border-radius:12px;background:var(--field);padding:0 12px;font-size:18px;font-weight:700;outline:none;-webkit-appearance:none;appearance:none;font-variant-numeric:tabular-nums}
.entrada:focus{border-color:var(--coral);box-shadow:0 0 0 3px var(--coral-soft);background:#fff}
input[type=date].entrada{font-size:16px;min-width:0}
.medidas{margin-top:14px;border-top:1px solid var(--line)}
.medida{display:grid;grid-template-columns:52px 1fr 1fr 44px;align-items:center;gap:8px;min-height:48px;border-bottom:1px solid var(--line);font-size:14px;font-variant-numeric:tabular-nums}
.medida:last-child{border-bottom:0}
.medida span:first-child{color:var(--muted);font-weight:600}
.medida b{font-weight:700}
.del{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:#A6ABB3}
.del svg{width:18px;height:18px}
.del:active{background:var(--soft)}
.graf-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:6px}
.graf-val{text-align:right;flex:none}
.graf-val b{font-size:24px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.graf-val small{font-size:13px;font-weight:700;color:var(--muted);margin-left:2px}
.delta{display:block;font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums}
.delta.bom{color:var(--green-ink)}
.delta.ruim{color:var(--coral)}
.delta.neutro{color:var(--muted)}
.graf svg{display:block;width:100%;height:auto;overflow:visible}
.graf .gl{stroke:var(--line);stroke-width:1}
.graf .area{fill:var(--coral);opacity:.08}
.graf .lin{fill:none;stroke:var(--coral);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.graf .pt{fill:#fff;stroke:var(--coral);stroke-width:2}
.graf .pt.ult{fill:var(--coral)}
.graf text{font-family:var(--font);font-size:11px;font-weight:600;fill:var(--muted)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:10px -16px 12px;padding:2px 16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:40px;padding:0 14px;border-radius:999px;background:var(--soft);font-size:13px;font-weight:700;color:var(--ink-2);white-space:nowrap}
.chip.on{background:var(--ink);color:#fff}
.pontos{margin:10px 0 0;padding:0;list-style:none}
.pontos li{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:13.5px;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.pontos li span:first-child{color:var(--muted)}
.fotos{display:flex;gap:12px;align-items:flex-start}
.fotos-ico{width:44px;height:44px;border-radius:12px;background:var(--soft);display:grid;place-items:center;flex:none;color:var(--ink-2)}
.fotos-ico svg{width:22px;height:22px}
.fotos.devido .fotos-ico{background:var(--coral);color:#fff}
.card.devido{box-shadow:var(--shadow),inset 0 0 0 1.5px #F4BDB8}
.fotos h2{margin:0;font-size:16px;font-weight:800}
.fotos p{margin:2px 0 0;color:var(--ink-2);font-size:14px}
.hist{border-top:1px solid var(--line)}
.hist:first-of-type{border-top:0}
.hist summary{display:flex;align-items:center;gap:12px;min-height:60px;padding:6px 0;cursor:pointer;list-style:none}
.hist summary::-webkit-details-marker{display:none}
.hist-data{width:48px;flex:none;text-align:center;line-height:1.15}
.hist-data small{display:block;font-size:12px;font-weight:600;color:var(--muted)}
.hist-data b{font-size:15px;font-weight:800;font-variant-numeric:tabular-nums}
.hist-tit{flex:1;min-width:0}
.hist-tit b{display:block;font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hist-tit span{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.seta{width:20px;height:20px;color:#A6ABB3;transition:transform .2s;flex:none}
.hist[open] .seta{transform:rotate(180deg)}
.hist-corpo{padding:0 0 14px}
.hist-ex{padding:8px 0;border-top:1px dashed var(--line)}
.hist-ex h4{margin:0 0 4px;font-size:14px;font-weight:700}
.hist-s{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;color:var(--ink-2);padding:1px 0;font-variant-numeric:tabular-nums}
.hist-s.aq span:first-child{color:var(--slate-ink)}
.hist-s.nao{color:#A6ABB3}
.legado{font-size:13.5px;color:var(--ink-2)}
.legado p{margin:6px 0}
.legado b{font-weight:700}

/* Regras */
.regra h3{margin:0 0 4px;font-size:16px;font-weight:800}
.regra p{margin:0;color:var(--ink-2)}
.fases{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:6px}
.fases li{padding:10px 12px;border-radius:12px;background:var(--soft);font-size:14px;color:var(--ink-2)}
.fases li b{display:block;color:var(--ink);font-weight:800}
.fases li.atual{background:var(--coral-soft);color:#7E1C16}
.fases li.atual b{color:var(--coral)}
.fase-card h2{margin:0;font-size:20px;font-weight:800;letter-spacing:-.01em}
.fase-card p{margin:4px 0 0;color:var(--ink-2)}
.ajuste{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:60px;padding:8px 0;border-top:1px solid var(--line);text-align:left}
.ajuste:first-of-type{border-top:0}
.ajuste-txt{flex:1;min-width:0}
.ajuste-txt b{display:block;font-size:15px;font-weight:700}
.ajuste-txt span{font-size:13px;color:var(--muted)}
.ajuste input[type=date]{width:150px;flex:none}
.switch{position:relative;width:52px;height:32px;border-radius:999px;background:#D3D7DC;flex:none;transition:background .2s}
.switch::after{content:'';position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
.switch.on{background:var(--green)}
.switch.on::after{transform:translateX(20px)}
.versao{margin:16px 0 0;text-align:center;font-size:12px;color:var(--muted)}

/* Barra inferior */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(255,255,255,.96);-webkit-backdrop-filter:saturate(1.4) blur(12px);backdrop-filter:saturate(1.4) blur(12px);border-top:1px solid var(--line);padding-bottom:var(--sb)}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--nav-h)}
.nav button{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:12px;font-weight:700}
.nav svg{width:24px;height:24px}
.nav button.on{color:var(--coral)}
.nav .badge{position:absolute;top:10px;left:calc(50% + 7px);width:9px;height:9px;border-radius:50%;background:var(--coral);box-shadow:0 0 0 2px #fff}

/* Cronômetro */
.timer{position:fixed;z-index:50;left:10px;right:10px;bottom:calc(var(--nav-h) + var(--sb) + 10px);max-width:540px;margin:0 auto;display:grid;grid-template-columns:92px minmax(0,1fr);gap:12px;align-items:center;padding:12px;border-radius:22px;background:var(--card);box-shadow:0 12px 32px rgba(17,24,39,.16),0 2px 6px rgba(17,24,39,.06);transform:translateY(160%);opacity:0;pointer-events:none;transition:transform .32s cubic-bezier(.2,.8,.2,1),opacity .25s}
.timer.aberto{transform:none;opacity:1;pointer-events:auto}
.timer-anel{position:relative;width:92px;height:92px}
.timer-anel svg{width:100%;height:100%;transform:rotate(-90deg)}
.timer-anel .trilho{stroke:var(--soft)}
.timer-anel .prog{stroke:var(--coral);transition:stroke-dashoffset .25s linear,stroke .3s}
.timer-num{position:absolute;inset:0;display:grid;place-items:center;font-size:28px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.timer-rot{margin:0 2px 8px;font-size:13px;font-weight:700;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer-btns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.timer-btns button{height:48px;border-radius:12px;background:var(--soft);font-size:15px;font-weight:800;font-variant-numeric:tabular-nums}
.timer-btns button:active{transform:scale(.96)}
.timer-btns .pular{background:var(--coral-soft);color:var(--coral)}
.timer.fim .timer-anel .prog{stroke:var(--green)}
.timer.fim .timer-num{color:var(--green)}
.timer.fim .timer-rot{color:var(--green-ink)}
.timer.fim{animation:balanca .5s ease 2}
@keyframes balanca{0%,100%{transform:none}25%{transform:translateY(-4px)}75%{transform:translateY(2px)}}

/* Aviso rápido */
.toast{position:fixed;z-index:70;left:50%;bottom:calc(var(--nav-h) + var(--sb) + 18px);max-width:calc(100% - 32px);transform:translate(-50%,16px);padding:12px 16px;border-radius:14px;background:var(--ink);color:#fff;font-size:14px;font-weight:600;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.18);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.on{opacity:1;transform:translate(-50%,0)}
body.com-timer .toast{bottom:calc(var(--nav-h) + var(--sb) + 150px)}

/* Treino salvo */
.festa{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:24px;background:rgba(244,245,247,.94);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .25s}
.festa.on{opacity:1;pointer-events:auto}
.festa-card{width:100%;max-width:380px;padding:28px 20px 20px;border-radius:24px;background:var(--card);box-shadow:0 20px 50px rgba(17,24,39,.14);text-align:center;transform:scale(.94);transition:transform .4s cubic-bezier(.2,1.4,.4,1)}
.festa.on .festa-card{transform:none}
.festa-card svg{width:88px;height:88px;display:block;margin:0 auto 12px}
.festa .fc{stroke-dasharray:277;stroke-dashoffset:277}
.festa .fp{stroke-dasharray:60;stroke-dashoffset:60}
.festa.on .fc{animation:desenha .6s ease-out forwards}
.festa.on .fp{animation:desenha .35s .5s ease-out forwards}
@keyframes desenha{to{stroke-dashoffset:0}}
.festa h2{margin:0;font-size:22px;font-weight:800}
.festa-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}
.festa-stats div{padding:10px 4px;border-radius:12px;background:var(--soft)}
.festa-stats b{display:block;font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.festa-stats span{font-size:12px;font-weight:600;color:var(--muted)}

/* Confirmação */
.dlg{position:fixed;inset:0;z-index:90;display:flex;align-items:flex-end;justify-content:center;padding:16px 12px calc(16px + var(--sb));background:rgba(22,24,29,.34);opacity:0;pointer-events:none;transition:opacity .2s}
.dlg.on{opacity:1;pointer-events:auto}
.dlg-card{width:100%;max-width:520px;padding:20px 16px 16px;border-radius:20px;background:var(--card);box-shadow:0 20px 50px rgba(17,24,39,.2);transform:translateY(24px);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.dlg.on .dlg-card{transform:none}
.dlg-card p{margin:0 4px 16px;font-size:16px;font-weight:600;line-height:1.4}

@media (min-width:420px){.topo h1{font-size:25px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.festa .fc,.festa .fp{stroke-dashoffset:0}}
</style>
</head>

function grafico(pts, unid, melhor) {

  s += '<line class="gl" x1="' + pl + '" x2="' + (W - pr) + '" y1="' + y(rmax).toFixed(1) + '" y2="' + y(rmax).toFixed(1) + '"/>';
  if (rmin !== rmax) s += '<line class="gl" x1="' + pl + '" x2="' + (W - pr) + '" y1="' + y(rmin).toFixed(1) + '" y2="' + y(rmin).toFixed(1) + '"/>';
  s += '<text x="0" y="' + (y(rmax) + 4).toFixed(1) + '">' + fmt(rmax, 1) + '</text>';
  if (rmin !== rmax) s += '<text x="0" y="' + (y(rmin) + 4).toFixed(1) + '">' + fmt(rmin, 1) + '</text>';
  if (n > 1) {
    const linha = pts.map((p, i) => x(i).toFixed(1) + ',' + y(p.y).toFixed(1)).join(' ');
    s += '<path class="area" d="M' + x(0).toFixed(1) + ',' + (H - pb) + ' L' + linha.split(' ').join(' L') + ' L' + x(n - 1).toFixed(1) + ',' + (H - pb) + ' Z"/>';

function cabecalhoGraf(titulo, sub, pts, unid, melhor) {

function pontosCarga(ex, modo) {
  const pts = [];

    const he = (e.ex || []).find(x => x.id === ex.id); if (!he) return;
    let best = null;
    (he.series || []).forEach(s => {
      if (modo === 'top' ? s.tipo !== 'top' : !ehValida(s.tipo)) return;
      const k = num(s.kg); if (!Number.isFinite(k)) return;
      if (!s.feito && !s.reps) return;
      const r = int(s.reps);
      if (!best || k > best.y || (k === best.y && (r || 0) > (best.reps || 0))) best = { data: e.data, y: k, reps: Number.isFinite(r) ? r : null };
    });
    if (best) pts.push(best);
  });

}

function lerArquivo(file) {
  const fr = new FileReader();
  fr.onload = async () => {
    let obj;
    try { obj = JSON.parse(fr.result); } catch (e) { toast('Arquivo inválido. Use um backup exportado por este app.'); return; }
    if (!obj || obj.app !== 'treino-henrique' || !obj.dados || !Array.isArray(obj.dados.hist)) { toast('Arquivo inválido. Use um backup exportado por este app.'); return; }
    const d = obj.dados;
    const quando = obj.exportadoEm ? new Date(obj.exportadoEm).toLocaleDateString('pt-BR') : 'data desconhecida';
    if (!(await confirmar('Importar backup de ' + quando + ' com ' + d.hist.length + ' treinos? Isso substitui os dados atuais deste celular.', 'Importar'))) return;
    salvar(K.hist, d.hist);
    salvar(K.med, Array.isArray(d.med) ? d.med : []);
    salvar(K.dieta, d.dieta && typeof d.dieta === 'object' ? d.dieta : {});
    salvar(K.draft, d.draft && typeof d.draft === 'object' ? d.draft : {});
    salvar(K.cfg, Object.assign({}, CFG_PADRAO, d.cfg || {}));
    if (obj.legado && typeof obj.legado === 'object') Object.keys(obj.legado).forEach(k => { if (/^th_/.test(k) && typeof obj.legado[k] === 'string') { try { localStorage.setItem(k, obj.legado[k]); } catch (e) {} } });
    toast('Backup importado.');
    setTimeout(() => location.reload(), 600);
  };
  fr.readAsText(file);
}
function pacoteBackup() {

  a.href = url; a.download = 'treino-henrique-backup-' + hoje() + '.json';

async function compartilhar() {

    case 'testar-apito': desbloquearAudio(); apito(); vibrar([350, 120, 350, 120, 350]); toast('Se não ouviu, aumente o volume de mídia do celular.', 3500); break;
    case 'ref-chk': { const st = dietaHoje(); const id = b.dataset.id; st.ref[id] = !st.ref[id]; salvar(K.dieta, S.dieta); const y = window.scrollY; render(); window.scrollTo(0, y); if (st.ref[id]) { const nb = $('[data-act="ref-chk"][data-id="' + id + '"]'); if (nb) nb.classList.add('pop'); vibrar(12); } break; }
    case 'agua': { const st = dietaHoje(); const ml = +b.dataset.ml; st.agua += ml; st.log.push(ml); salvar(K.dieta, S.dieta); const y = window.scrollY; render(); window.scrollTo(0, y); if (st.agua >= DIETA.aguaMetaMl && st.agua - ml < DIETA.aguaMetaMl) toast('Meta de água batida.'); break; }
    case 'agua-desfazer': { const st = dietaHoje(); const ml = st.log.pop(); if (ml) st.agua = Math.max(0, st.agua - ml); salvar(K.dieta, S.dieta); const y = window.scrollY; render(); window.scrollTo(0, y); break; }
    case 'med-salvar': {
      const data = $('#mData').value; const peso = $('#mPeso').value.trim(); const cint = $('#mCint').value.trim();
      if (!ehData(data)) { toast('Escolha a data da medida.'); break; }
      const vp = num(peso), vc = num(cint);
      if (peso && !(vp > 0)) { toast('Peso inválido.'); break; }
      if (cint && !(vc > 0)) { toast('Cintura inválida.'); break; }
      if (!peso && !cint) { toast('Preencha o peso, a cintura ou os dois.'); break; }
      const i = S.med.findIndex(m => m.data === data);
      const reg = { data: data, peso: peso ? vp : (i >= 0 ? S.med[i].peso : null), cintura: cint ? vc : (i >= 0 ? S.med[i].cintura : null) };
      if (i >= 0) S.med[i] = reg; else S.med.push(reg);
      S.med.sort((a, b2) => a.data < b2.data ? -1 : 1);
      salvar(K.med, S.med); render(); toast('Medida de ' + ddmm(data) + ' salva.'); break;
    }
    case 'med-del': {
      const data = b.dataset.data;
      confirmar('Apagar a medida de ' + ddmm(data) + '?', 'Apagar').then(sim => {
        if (!sim) return; S.med = S.med.filter(m => m.data !== data); salvar(K.med, S.med); const y = window.scrollY; render(); window.scrollTo(0, y);
      });
      break;
    }
    case 'foto-ok': S.cfg.ultimaFoto = hoje(); salvar(K.cfg, S.cfg); render(); toast('Anotado. Próximas fotos em 4 semanas.'); break;
    case 'sel-top': { ui.topSel = b.dataset.id; const y = window.scrollY; render(); window.scrollTo(0, y); break; }
    case 'sel-lat': { ui.latSel = b.dataset.id; const y = window.scrollY; render(); window.scrollTo(0, y); break; }
    case 'hist-del': {
      const id = b.dataset.id;
      confirmar('Excluir este treino do histórico? Não dá para desfazer.', 'Excluir').then(sim => {
        if (!sim) return; S.hist = S.hist.filter(e => e.id !== id); salvar(K.hist, S.hist); const y = window.scrollY; render(); window.scrollTo(0, y); toast('Treino excluído.');
      });
      break;
    }
    case 'exportar': exportar(); break;
    case 'compartilhar': compartilhar(); break;
    case 'importar': $('#arquivo').click(); break;
  }
});

document.addEventListener('input', ev => {
  const el = ev.target;
  if (el.dataset && el.dataset.f) {
    const card = el.closest('.ex'); if (!card || !ui.dia) return;
    const f = el.dataset.f;
    const limpo = f === 'kg' ? el.value.replace(/[^0-9.,]/g, '') : el.value.replace(/[^0-9]/g, '');
    if (limpo !== el.value) el.value = limpo;
    const ex = diaPor(ui.dia).ex[+card.dataset.ex];
    const rows = garantirRows(ui.dia, ex); const r = rows[+el.dataset.i];
    if (el.dataset.p != null) r.p[+el.dataset.p][f] = limpo; else r[f] = limpo;
    salvar(K.draft, S.draft);
    const slot = card.querySelector('.slot-aviso');
    const novo = htmlAvisoSubir(ex, rows);
    if ((slot.innerHTML === '') !== (novo === '')) slot.innerHTML = novo;
  }
});
document.addEventListener('change', ev => {
  const el = ev.target;
  if (el.dataset && el.dataset.cfg) {
    const v = el.value;
    S.cfg[el.dataset.cfg] = ehData(v) ? v : '';
    salvar(K.cfg, S.cfg);
    const y = window.scrollY; render(); window.scrollTo(0, y);
    toast(v ? 'Data salva.' : 'Data apagada.');
  }
  if (el.id === 'arquivo' && el.files && el.files[0]) { lerArquivo(el.files[0]); el.value = ''; }
});
document.addEventListener('keydown', ev => {
  const el = ev.target;
  if (ev.key === 'Escape' && dlgResolve) { fecharDlg(false); return; }
  if (ev.key === 'Enter' && el.dataset && el.dataset.f) {
    ev.preventDefault();
    if (el.dataset.f === 'kg') { const prox = el.closest('.campo').nextElementSibling; const inp = prox && prox.querySelector('input'); if (inp) inp.focus(); else el.blur(); }
    else el.blur();
  }
});
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    if (T) retomarTimer();
    if (actx && actx.state !== 'running') { try { actx.resume().catch(() => {}); } catch (e) {} }
    pedirTela();
  }
});

/* Início */
render();
if (T) retomarTimer();
pedirTela();

if ('serviceWorker' in navigator) {
  let tinhaControle = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (tinhaControle) toast('App atualizado. Feche e abra de novo para ver a versão nova.', 4000);
    tinhaControle = true;
  });
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then(reg => { try { reg.update(); } catch (e) {} }).catch(() => {});
  });
}
})();
</script>
</body>
